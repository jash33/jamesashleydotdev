name: Deploy to S3 + CloudFront

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::931806663715:role/github-actions-jamesashleydotdev-deploy
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync dist/ s3://jamesashleydotdev-site --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E27KZ6FJCK14JD --paths "/*"
